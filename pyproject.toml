[project]
name = "nomos"
version = "0.1.0"
description = "Offline photo Location tagger: resolves photo GPS coordinates to a Region and Country and writes them into XMP."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "geopandas>=1.0",
    "pyogrio>=0.10",
    "pyproj>=3.6",
    "shapely>=2.0",
]

[project.scripts]
nomos = "nomos.cli:main"

[dependency-groups]
dev = [
    "pillow>=10",
    "pytest>=8",
]

[build-system]
requires = ["uv_build>=0.9,<0.20"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
# The golden suite needs the real Dataset release (about 760 MB); run it with `pytest -m golden`.
addopts = "-ra -m 'not golden'"
markers = [
    "golden: runs against the real Dataset release (geoBoundaries CGAZ), not the fixture",
]

[tool.uv]
# Keep the lockfile independent of any user-level uv config (CI has none).
exclude-newer = "7 days"
